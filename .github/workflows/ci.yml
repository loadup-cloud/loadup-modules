name: Modules CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      publish-packages:
        description: Publish Maven packages after verification (main, develop or dev only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: ci
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_REUSE_ENABLE: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Check Docker for integration tests
        run: docker info

      - name: Build, test and package
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME || github.actor }}
          MAVEN_TOKEN: ${{ secrets.OSSRH_TOKEN || github.token }}
        run: |
          mvnd -B -ntp -U -T 1 -Pgithub clean verify \
            -Djacoco.skip=true -Dtestcontainers.reuse.enable=false

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: loadup-modules-test-reports
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**

  publish:
    name: Publish GitHub Packages
    needs: verify
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish-packages)) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: github-packages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Publish Maven packages
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.OSSRH_TOKEN }}
        run: |
          : "${MAVEN_USERNAME:?Missing organization Actions secret OSSRH_USERNAME}"
          : "${MAVEN_TOKEN:?Missing organization Actions secret OSSRH_TOKEN with write access to LoadUp Packages}"
          mvnd -B -ntp -U -T 1 -Pgithub clean deploy \
            -DaltDeploymentRepository=github::https://maven.pkg.github.com/loadup-cloud/loadup-packages \
            -DdeployAtEnd=true -Dmaven.test.skip=true -Djacoco.skip=true
